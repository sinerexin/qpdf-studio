[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qpdf-studio"
version = "0.1.0"
description = "An open-source qpdf-powered PDF inspection and authorized signing extension"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pikepdf>=10.17,<11",
    "pypdf>=6,<7",
    "pyHanko>=0.38,<0.39",
    "pypdfium2>=5,<6",
    "Pillow>=10",
    "PySide6>=6.8,<7",
    "reportlab>=4,<5",
]

[project.scripts]
qpdf-studio = "pdf_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
